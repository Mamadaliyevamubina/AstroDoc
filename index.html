<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrodoc</title>
  <meta name="description" content="Astrodoc: simple health monitoring for astronauts far from Earth.">
  <link rel="icon" href="assets/astrodoc-favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="top">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="assets/astrodoc-logo-mark.png" alt=""></span>
      <span class="brand-name">Astrodoc</span>
    </a>
    <!-- Crew buttons are built in app.js -->
    <div class="crew" id="crewSelector" role="group" aria-label="Select crew member"></div>
    <!-- Mission line is built in app.js -->
    <div class="mission" id="missionStrip"></div>
    <button class="emergency-btn" id="emergencyBtn">Emergency</button>
  </header>

  <main class="page">
    <div class="main-col">
      <!-- Emergency: confirm / active banner, built in app.js -->
      <section class="emergency-box" id="emergencyBox" hidden></section>

      <!-- ===================== 1. STATUS ===================== -->
      <section class="card status-card">
        <div id="statusCard"></div>
        <div class="status-foot">
          <button class="text-btn" id="reportBtn">Send report to Earth</button>
          <span class="muted small" id="reportNote"></span>
        </div>
      </section>

      <!-- ===================== 2. FOUR READINGS ===================== -->
      <section class="vitals" id="vitals" aria-label="Readings"></section>

      <!-- ===================== 3. TODAY (input) ===================== -->
      <section class="card today" id="today" aria-labelledby="todayTitle">
        <h2 id="todayTitle">Today</h2>
        <div class="today-grid">
          <label class="field">
            <span>Sleep last night</span>
            <span class="input-unit"><input type="number" id="ciSleep" min="0" max="14" step="0.1" inputmode="decimal"><em>h</em></span>
          </label>
          <div class="field">
            <span id="moodSelfLabel">Mood, you</span>
            <div class="scale" id="moodSelf" role="group" aria-labelledby="moodSelfLabel"></div>
          </div>
          <div class="field">
            <span id="moodMateLabel">Mood, as a crewmate sees you</span>
            <div class="scale" id="moodMate" role="group" aria-labelledby="moodMateLabel"></div>
          </div>
          <div class="field">
            <span>Water today</span>
            <div class="counter"><button id="waterMinus" aria-label="One glass less">−</button><b id="waterCount"></b><button id="waterPlus" aria-label="One glass more">+</button></div>
          </div>
          <div class="field">
            <span>Exercise this week</span>
            <div class="counter"><button id="exMinus" aria-label="One session less">−</button><b id="exCount"></b><button id="exPlus" aria-label="One session more">+</button></div>
          </div>
        </div>
      </section>

      <!-- Demo controls (for the presentation; Arduino stand-ins) -->
      <details class="demo">
        <summary>Demo controls</summary>
        <div class="demo-grid">
          <label>Solar activity (70+ = storm)<input type="range" id="solarSlider" min="0" max="100"></label>
          <label>Location<select id="locationSelect"></select></label>
          <label>Heart rate (bpm)<input type="number" id="simHr" value="96"></label>
          <label>Temperature (°C)<input type="number" id="simTemp" value="36.8" step="0.1"></label>
          <button class="soft-btn" id="simApply">Send reading</button>
        </div>
      </details>
    </div>

    <!-- ===================== 4. COMPANION CHAT ===================== -->
    <aside class="card chat" id="voicePanel" aria-label="Astrodoc companion">
      <div class="face-wrap">
        <!-- Companion face: floating features on a soft mint glow.
             voice.js uses .eye, .pupil, .smile, .mouth-open, .brow and the classes on #face. -->
        <svg class="face" id="face" viewBox="0 0 200 170" aria-hidden="true">
          <defs>
            <radialGradient id="faceGlow">
              <stop offset="0" stop-color="#5be1c8" stop-opacity=".34"/>
              <stop offset=".6" stop-color="#5be1c8" stop-opacity=".1"/>
              <stop offset="1" stop-color="#5be1c8" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle class="glow" cx="100" cy="86" r="92" fill="url(#faceGlow)"/>
          <g class="features">
            <path class="brow brow-l" d="M50 42 Q63 34 77 39" fill="none" stroke="#2a3160" stroke-width="4.5" stroke-linecap="round"/>
            <path class="brow brow-r" d="M123 39 Q137 34 150 42" fill="none" stroke="#2a3160" stroke-width="4.5" stroke-linecap="round"/>
            <g class="eye eye-l">
              <ellipse cx="64" cy="76" rx="17" ry="21" fill="#2a3160"/>
              <g class="pupil">
                <ellipse cx="64" cy="85" rx="9.5" ry="6.5" fill="#5be1c8" opacity=".6"/>
                <circle cx="70" cy="67" r="6" fill="#fff"/>
                <circle cx="58.5" cy="86" r="2.6" fill="#fff" opacity=".9"/>
              </g>
            </g>
            <g class="eye eye-r">
              <ellipse cx="136" cy="76" rx="17" ry="21" fill="#2a3160"/>
              <g class="pupil">
                <ellipse cx="136" cy="85" rx="9.5" ry="6.5" fill="#5be1c8" opacity=".6"/>
                <circle cx="142" cy="67" r="6" fill="#fff"/>
                <circle cx="130.5" cy="86" r="2.6" fill="#fff" opacity=".9"/>
              </g>
            </g>
            <path class="happy" d="M48 80 Q64 64 80 80" fill="none" stroke="#2a3160" stroke-width="4.5" stroke-linecap="round"/>
            <path class="happy" d="M120 80 Q136 64 152 80" fill="none" stroke="#2a3160" stroke-width="4.5" stroke-linecap="round"/>
            <ellipse class="cheek" cx="40" cy="106" rx="12" ry="6.5"/>
            <ellipse class="cheek" cx="160" cy="106" rx="12" ry="6.5"/>
            <path class="smile" d="M90 110 Q100 119 110 110" fill="none" stroke="#2a3160" stroke-width="4.5" stroke-linecap="round"/>
            <ellipse class="mouth-open" cx="100" cy="114" rx="8" ry="7" fill="#2a3160"/>
          </g>
        </svg>
        <div class="voice-crew" id="voiceCrew"></div>
        <div class="calm-text" id="calmText"></div>
        <button class="soft-btn calm-exit" id="calmExit">I feel better</button>
      </div>

      <div class="voice-log" id="voiceLog" aria-live="polite"></div>

      <div class="voice-chips">
        <button data-ask="All crew status">Everyone</button>
        <button data-ask="What should I do?">What to do?</button>
        <button data-ask="Calm me down" class="calm-chip">Calm me down</button>
      </div>

      <form class="voice-form" id="voiceForm">
        <button type="button" class="mic-btn" id="micBtn" aria-label="Speak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <input id="voiceInput" type="text" placeholder="Ask: how is the pilot?" autocomplete="off" aria-label="Ask Astrodoc">
        <button class="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="voice-state muted small" id="voiceState">Type, tap, or press the mic</div>
    </aside>
  </main>

  <footer class="foot">
    <span>Astrodoc · Dombit Education · NASA Space Apps Challenge 2026</span>
    <span>Prototype. Not a medical device. Simulated data.</span>
  </footer>

  <script src="app.js"></script>
  <script src="voice.js"></script>
</body>
</html>
